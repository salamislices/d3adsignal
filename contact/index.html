<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – D3AD Signal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background-color: #000000;
            
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="600" viewBox="0 0 16 600" preserveAspectRatio="none"><defs><pattern id="light" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="%235a0000"/></pattern><pattern id="medium" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="%235a0000"/><rect x="2" y="2" width="2" height="2" fill="%235a0000"/></pattern><pattern id="heavy" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="%235a0000"/><rect width="2" height="2" fill="%23000000"/><rect x="2" y="2" width="2" height="2" fill="%23000000"/></pattern></defs><rect width="16" height="150" fill="url(%23light)"/><rect y="150" width="16" height="150" fill="url(%23medium)"/><rect y="300" width="16" height="150" fill="url(%23heavy)"/><rect y="450" width="16" height="150" fill="%235a0000"/></svg>');
            
            background-repeat: repeat-x;
            background-size: 32px 100vh; 
            background-attachment: fixed;
            
            image-rendering: pixelated;
            image-rendering: crisp-edges;

            font-size: 1.2rem;
            color: #ffffff;
            font-family: 'VT323', monospace;
            letter-spacing: 1px;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: stretch;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1400px; 
            gap: 60px; 
            align-items: center;
            justify-content: center;
            background-color: #000000;
            padding: 40px 80px;
            box-sizing: border-box;
        }

        .text-content {
            width: 100%;
            max-width: 550px;
        }

        h2 {
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .find-me-hub {
            margin-bottom: 30px;
            border-bottom: 2px dashed #5a0000;
            padding-bottom: 20px;
        }

        .hub-title {
            font-size: 1.4rem;
            color: #ba1b1b;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .social-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.4rem;
            width: fit-content;
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .social-link:hover {
            color: #ba1b1b;
            transform: translateX(5px);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 1.4rem;
            color: #ba1b1b;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            background-color: #000000;
            border: 2px solid #5a0000;
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 1px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #ffffff;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background-color: #ba1b1b;
            color: #ffffff;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            padding: 8px 20px;
            cursor: pointer;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #ffffff;
            color: #000000;
            transform: scale(1.05);
        }

        /* --- Back Button Styling --- */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .back-btn img {
            display: block;
            max-width: 100px;
            height: auto;
            image-rendering: pixelated;
        }

        .back-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        .gif-container img {
            max-width: 1000px;
            width: 110%;
            height: auto;
            display: block;
        }

        @media (max-width: 1100px) { 
            body {
                align-items: center;
            }
            .container {
                flex-direction: column-reverse; 
                text-align: left;
                padding: 40px 20px;
                min-height: 100vh;
            }
            .gif-container img {
                max-width: 450px; 
                margin: 0 auto 20px auto;
            }
            .back-btn {
                display: block;
                margin: 0 auto;
                width: max-content;
            }
            .submit-btn {
                width: 100%;
            }
            .social-links {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-content">
            <h2>CONTACT ME</h2>

            <div class="find-me-hub">
                <div class="hub-title">FIND ME HERE AT SOCIALS:</div>
                <div class="social-links">
                    <a href="https://instagram.com/d3dsignal" target="_blank" class="social-link">[ INSTAGRAM ]</a> 
                    <a href="https://x.com/d3dsignal" target="_blank" class="social-link">[ TWITTER ]</a>
                </div>
                
                <p style="margin-top: 15px; margin-bottom: 0;">Or email me here:</p>
            </div>
            
            <form action="PASTE_YOUR_FORMSPREE_URL_HERE" method="POST">
                <div class="form-group">
                    <label for="name">NAME</label>
                    <input type="text" id="name" name="name" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="email">YOUR EMAIL</label>
                    <input type="email" id="email" name="email" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="message">MESSAGE</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="submit-btn">[ SEND ]</button>
            </form>
            
            <a href="../" class="back-btn">
                <img src="../images/dithered-video.gif" alt="Back to Home">
            </a>
        </div>

        <div class="gif-container">
            <img src="../images/sinning.gif" alt="Spinning graphic">
        </div>
    </div>

</body>
</html>
